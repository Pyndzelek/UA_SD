services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  central:
    build:
      context: .
      dockerfile: WM_Central/Dockerfile
    command: ["5000", "kafka:19092"]
    ports:
      - "5000:5000"
      - "8000:8000"
    depends_on:
      - kafka
    restart: on-failure

  monitor:
    build:
      context: .
      dockerfile: WM_WS/Dockerfile.monitor
    command: ["6001", "central", "5000", "WS1"]
    depends_on:
      - central
    restart: on-failure

  engine:
    build:
      context: .
      dockerfile: WM_WS/Dockerfile.engine
    command: ["monitor", "6001", "kafka:19092"]
    stdin_open: true
    tty: true
    depends_on:
      - monitor
    restart: on-failure

  monitor2:
    build:
      context: .
      dockerfile: WM_WS/Dockerfile.monitor
    command: ["6001", "central", "5000", "WS2", "Garden"]
    depends_on:
      - central
    restart: on-failure

  engine2:
    build:
      context: .
      dockerfile: WM_WS/Dockerfile.engine
    command: ["monitor2", "6001", "kafka:19092"]
    stdin_open: true
    tty: true
    depends_on:
      - monitor2
    restart: on-failure

  fo:
    build:
      context: .
      dockerfile: WM_FO/Dockerfile
    command: ["kafka:19092", "OP1", "WS1"]
    profiles: ["tools"]
