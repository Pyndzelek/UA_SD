# one watering station = two terminals, use your own -p name and WS_ID per station
#   terminal 1 (monitor logs): WS_ID=WS1 LOCATION=Park docker compose -p ws1 -f docker-compose.ws.yml up --build monitor
#   terminal 2 (engine menu):  docker compose -p ws1 -f docker-compose.ws.yml run --rm --build --no-deps engine
services:
  monitor:
    build:
      context: .
      dockerfile: WM_WS/Dockerfile.monitor
    command: ["6001", "${CENTRAL_HOST:?set CENTRAL_HOST in .env}", "${CENTRAL_PORT:-5000}", "${WS_ID:-WS1}", "${LOCATION:-Park}"]
    init: true  # Ctrl+C / docker stop end it at once instead of after 10 s

  engine:
    build:
      context: .
      dockerfile: WM_WS/Dockerfile.engine
    command: ["${KAFKA:?set KAFKA in .env}", "monitor", "6001"]
    init: true
    stdin_open: true
    tty: true
