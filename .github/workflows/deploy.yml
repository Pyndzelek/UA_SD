# CI/CD: every push to main redeploys the cloud part on the EC2 machine
# needs the repo secrets EC2_HOST (public ip) and EC2_KEY (labsuser.pem content)
name: deploy to aws

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd watering_management_system
            git pull
            docker compose -f docker-compose.cloud.yml up -d --build
