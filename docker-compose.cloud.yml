#   PUBLIC_IP=<ec2 public ip> docker compose -f docker-compose.cloud.yml up -d --build
services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # the lab PCs get this address back from kafka, so it must be the public ip
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://${PUBLIC_IP:?set PUBLIC_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: always

  central:
    build:
      context: .
      dockerfile: WM_Central/Dockerfile
    command:
      [
        "5000",
        "kafka:19092",
        "--panel-port",
        "8000",
        "--db",
        "/app/data/central.db",
      ]
    ports:
      - "5000:5000"
      - "8000:8000"
    volumes:
      - central-data:/app/data # the database survives restarts and redeploys
    stdin_open: true # docker attach gives the admin console
    tty: true
    depends_on:
      - kafka
    restart: always

volumes:
  central-data:
